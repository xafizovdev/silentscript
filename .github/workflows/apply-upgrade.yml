name: Apply Silent Script upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/apply-upgrade.cjs
      - .github/workflows/apply-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified source upgrade
        run: node scripts/apply-upgrade.cjs
      - name: Commit generated source and assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Upgrade branding and one-letter personalization"
          git push
