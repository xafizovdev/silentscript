name: Apply Silent Script commerce upgrade

on:
  push:
    branches: [main]
    paths:
      - scripts/silent-commerce-upgrade.b64
      - .github/workflows/apply-silent-commerce-upgrade.yml

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract verified storefront and admin files
        run: |
          base64 --decode scripts/silent-commerce-upgrade.b64 > /tmp/silent-upgrade.tar.gz
          tar -xzf /tmp/silent-upgrade.tar.gz -C .
          rm -f scripts/silent-commerce-upgrade.b64
          rm -f .github/workflows/apply-silent-commerce-upgrade.yml
          rm -f public/brand-avatar.svg app/apple-icon.svg
      - name: Commit production upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add leather covers, dynamic pricing and admin CMS"
          git push
