name: Apply storefront type fix

on:
  push:
    branches: [redesign/pro-storefront-v6]
    paths: [.github/workflows/apply-storefront-fix.yml]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: redesign/pro-storefront-v6
          fetch-depth: 0
      - name: Apply exact source fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/storefront/Storefront.tsx')
          source = path.read_text(encoding='utf-8')
          source = source.replace('import "./storefront.css";\n', '')
          source = source.replace('([title, text]: [string, string], index: number)', '([title, text]: readonly [string, string], index: number)')
          source = source.replace('([question, answer]: [string, string])', '([question, answer]: readonly [string, string])')
          path.write_text(source, encoding='utf-8')
          PY
      - name: Commit exact fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/storefront/Storefront.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Fix storefront readonly tuple typing"
          git push origin HEAD:redesign/pro-storefront-v6
