name: Storefront production build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Smoke test storefront and admin routes
        shell: bash
        run: |
          npm run start -- -p 3000 > /tmp/silentscript-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/home.html; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/silentscript-next.log
            exit 1
          fi

          grep -qi "silent script" /tmp/home.html
          curl --fail --silent --show-error http://127.0.0.1:3000/api/catalog > /tmp/catalog.json
          node -e "const fs=require('fs'); const data=JSON.parse(fs.readFileSync('/tmp/catalog.json','utf8')); if(!Array.isArray(data.products)||data.products.length===0) process.exit(1);"
          curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/admin
