name: Bootstrap Silent Script

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  unpack-project:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Restore project files
        shell: bash
        run: |
          set -euo pipefail
          cat .payload/part-* > /tmp/silent-script.b64
          base64 --decode /tmp/silent-script.b64 > /tmp/silent-script.zip
          mkdir -p /tmp/silent-script
          unzip -q -o /tmp/silent-script.zip -d /tmp/silent-script
          rsync -a /tmp/silent-script/ ./
          rm -rf .payload
          rm -f .github/workflows/bootstrap.yml

      - name: Commit restored website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Launch Silent Script website"
          git push origin main
